services:
  orchestrator:
    build:
      context: .
    image: poly-oracle-agent:latest
    command: python -m src.orchestrator
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/poly_oracle.db
      HEALTH_SERVER_HOST: "0.0.0.0"
      METRICS_SERVER_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - poly_oracle_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backtester:
    build:
      context: .
    image: poly-oracle-agent:latest
    command: python -m src.backtest_runner --data-dir /data/historical --output /data/backtest_reports/report.json
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/poly_oracle.db
    volumes:
      - poly_oracle_data:/data
    profiles:
      - backtester

  dashboard:
    build:
      context: .
    image: poly-oracle-agent:latest
    command: streamlit run src/ui/dashboard.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    environment:
      DASHBOARD_DB_PATH: /data/poly_oracle.db
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - poly_oracle_data:/data
    profiles:
      - dashboard
    restart: unless-stopped

volumes:
  poly_oracle_data:
    driver: local
